name: Deploy Mythos to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      # Deployment only needs the generated retrieval files; content/index.json
      # is committed. The builder skips source records absent from this clone
      # (e.g. personal-local-only texts), which the full validator would reject.
      - run: python -B tools/build_retrieval_index.py
      # Site is the repo root; tar excludes .git/.github automatically and
      # secrets like .env are gitignored so never reach this checkout.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.
      - id: deployment
        uses: actions/deploy-pages@v4
